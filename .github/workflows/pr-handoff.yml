name: PR Handoff Packet

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-handoff:
    name: Build PR handoff packet
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch changed files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
            --jq '[.[] | {filename, status, additions, deletions, changes}]' \
            > pr-files.json

      - name: Run handoff checks
        id: handoff_checks
        run: |
          set +e
          npm run check > pr-check-output.log 2>&1
          status=$?
          cat pr-check-output.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build handoff packet
        run: node tools/pr-handoff-report.mjs pr-files.json pr-check-output.log
        env:
          PR_HANDOFF_CHECK_STATUS: ${{ steps.handoff_checks.outputs.status }}

      - name: Add packet to workflow summary
        run: cat pr-handoff.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload PR handoff packet
        uses: actions/upload-artifact@v4
        with:
          name: pr-handoff-${{ github.event.pull_request.number }}-${{ github.run_id }}
          path: |
            pr-handoff.md
            pr-files.json
            pr-check-output.log
