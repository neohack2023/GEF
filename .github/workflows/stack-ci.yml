name: Stack CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Validate package scripts
        run: npm run check --if-present

      - name: Write CI context
        if: always()
        run: node scripts/ci/write-ci-context.mjs "${{ job.status }}"

      - name: Upload CI context
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-ci-context
          path: reports/ci/
